services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gabin-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=gabin#2025
      - MSSQL_PID=Developer
    ports:
      - "1434:1433"
    volumes:
      - gabin_dbdata:/var/opt/mssql
    networks:
      - gabin_net

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    container_name: gabin-db-init
    depends_on:
      - db
    volumes:
      - ./db/init.sql:/init/init.sql:ro
    networks:
      - gabin_net
    restart: "no"
    command: >
      sh -lc '
        set -e;
        SQLCMD="/opt/mssql-tools/bin/sqlcmd";
        if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then SQLCMD="/opt/mssql-tools18/bin/sqlcmd"; fi;

        echo "Aguardando SQL Server aceitar conexões...";
        until $$SQLCMD -S db -U sa -P "gabin#2025" -Q "SELECT 1" >/dev/null 2>&1; do
          sleep 2;
        done;

        echo "Rodando init.sql...";
        $$SQLCMD -S db -U sa -P "gabin#2025" -i /init/init.sql;

        echo "Init concluído.";
      '

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gabin-api
    environment:
      - DB_HOST=db
      - DB_PORT=1434
      - DB_USER=sa
      - DB_PASSWORD=gabin#2025
      - DB_NAME=appdb
      - PORT=3001
      # (opcional) ajuda a testar hipótese do cookie Secure:
      # - NODE_ENV=development
    depends_on:
      - db
      - db-init
    ports:
      - "3001:3001"
    networks:
      - gabin_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: gabin-web
    depends_on:
      - api
    ports:
      - "8087:80"
    networks:
      - gabin_net

networks:
  gabin_net:

volumes:
  gabin_dbdata:
